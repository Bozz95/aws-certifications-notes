      - Lambda: services/compute/lambda.md
      - ECS: services/compute/ecs.md
      - EKS: services/compute/eks.md
      - Elastic Beanstalk: services/compute/elastic-beanstalk.md
    - Storage:
      - services/storage/index.md
      - S3: services/storage/s3.md
      - EBS: services/storage/ebs.md
      - EFS: services/storage/efs.md
      - FSx: services/storage/fsx.md
    - Database:
      - services/database/index.md
      - RDS: services/database/rds.md
      - DynamoDB: services/database/dynamodb.md
      - ElastiCache: services/database/elasticache.md
      - Redshift: services/database/redshift.md
    - Networking:
      - services/networking/index.md
      - VPC: services/networking/vpc.md
      - CloudFront: services/networking/cloudfront.md
      - Route 53: services/networking/route53.md
      - API Gateway: services/networking/api-gateway.md
    - Security:
      - services/security/index.md

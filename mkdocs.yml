site_name: AWS Certifications Study Guide
site_description: Comprehensive notes and study materials for AWS certifications
site_author: AWS Certification Student
site_url: https://your-domain.github.io/aws-certifications-notes/

repo_name: aws-certifications-notes
repo_url: https://github.com/your-username/aws-certifications-notes
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 AWS Certification Study Guide

theme:
  name: material
  language: en
  logo: assets/aws-logo.png
  favicon: assets/favicon.ico
  
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.tooltips
    - content.action.edit
    - content.action.view
    - toc.follow
    - toc.integrate

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
      
    tags:
      devops: material/microsoft-azure-devops
      cicd: octicons/infinity-16
      Security: security
      Compute: compute
      Storage: storage
      Database: database
      Networking: networking
      Monitoring: monitoring

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: your-username
      repo: aws-certifications-notes
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - tags:
      tags_file: tags.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://Bozz95@github.com/Bozz95/aws-certifications-notes.git
  
  tags:
    DevOps: devops
    CI/CD: cicd
    Security: security
    Compute: compute
    Storage: storage
    Database: database
    Networking: networking
    Monitoring: monitoring

